name: Build and Run Test Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-image:
    name: Docker test image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (runs JUnit suite at build time)
        id: build
        run: |
          docker build \
            -f Dockerfile.test \
            -t rate-limiter-test:${{ github.sha }} \
            .

      - name: Post result as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.build.outcome }}';
            const passed  = outcome === 'success';
            const sha     = '${{ github.sha }}'.substring(0, 7);
            const marker  = '<!-- test-image-bot -->';
            const icon    = passed ? '✅' : '❌';
            const status  = passed ? 'passed' : 'failed';

            const body = [
              marker,
              `## ${icon} Test Image — ${status}`,
              '',
              `Image \`rate-limiter-test:${sha}\` built from \`Dockerfile.test\`.`,
              `All JUnit 5 tests **${status}**.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
