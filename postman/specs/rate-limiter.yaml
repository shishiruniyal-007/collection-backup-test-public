openapi: 3.0.3
info:
  title: Rate Limiter API
  contact:
    name: Platform team
  version: 0.1.0
  description: Fixed-window rate limiter.
paths:
  /limiters:
    post:
      summary: Create a rate limiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimiterConfig'
      responses:
        '201':
          description: Limiter created
  /limiters/{id}/allow:
    post:
      summary: Check whether a request is allowed
      description: Returns 429 when the limiter has no capacity left.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
  /limiters/{id}/reset:
    post:
      summary: Reset a rate limiter's window
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Window cleared
components:
  schemas:
    LimiterConfig:
      type: object
      required: [limit, windowSeconds]
      properties:
        limit:
          type: integer
          description: Maximum requests per window.
        windowSeconds:
          type: integer
          description: Window length in seconds.
        burst:
          type: integer
          description: Extra requests allowed above the limit in a short burst.
