openapi: 3.0.3
info:
  title: Rate Limiter API
  version: 0.1.0
  description: Sliding-window rate limiter.
paths:
  /limiters:
    post:
      summary: Create a rate limiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimiterConfig'
      responses:
        '201':
          description: Limiter created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: Unique identifier for the created limiter.
        '400':
          description: Invalid configuration — limit and windowSeconds must be positive integers
  /limiters/{id}/allow:
    post:
      summary: Check whether a request is allowed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision — request is within the rate limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
        '404':
          description: Limiter not found
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
components:
  schemas:
    LimiterConfig:
      type: object
      required: [limit, windowSeconds]
      properties:
        limit:
          type: integer
          minimum: 1
          description: Maximum requests per window.
        windowSeconds:
          type: integer
          minimum: 1
          description: Window length in seconds.
