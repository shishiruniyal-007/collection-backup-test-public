$kind: http-example
request:
  url: "{{baseUrl}}/limiters"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "limit": 100,
        "windowSeconds": 60
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "limiter-abc123"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Unique identifier for the created limiter."
          }
        },
        "required": [
          "id"
        ]
      }
order: 1000
